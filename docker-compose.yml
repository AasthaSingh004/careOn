services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: careon-backend:latest
    container_name: careon-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite:////data/careon.db
      - PYTHONUNBUFFERED=1
    volumes:
      # Persistent Docker volume for SQLite database storage
      - careon_data:/data
    networks:
      - careon-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: careon-frontend:latest
    container_name: careon-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - careon-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  careon-net:
    driver: bridge

volumes:
  careon_data:
    driver: local

name: CareOn CI Pipeline (Tests & Quality Assurance)

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Backend Code Imports
        run: |
          python -c "import app.main; print('CareOn backend modules imported successfully')"

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          pytest backend/tests/ -v --tb=short

  frontend-test-and-build:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Vitest Suite
        working-directory: ./frontend
        run: npm test

      - name: Build React Production Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Validate Production Build Artifacts
        run: |
          test -f frontend/dist/index.html || (echo "Missing dist/index.html!" && exit 1)
          echo "Production frontend build verified successfully."

      - name: Upload Production Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: careon-frontend-dist
          path: frontend/dist/
          retention-days: 7
